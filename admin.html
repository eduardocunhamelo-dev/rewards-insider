<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Insider Rewards · Controle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --ink:#080B10; --surface:#111721; --surface2:#18202C; --line:rgba(255,255,255,.07);
    --green:#00FC84; --green-dim:#0BC46A; --gold:#E4B33C; --gold-hi:#F6D77A;
    --red:#FF6060; --amber:#FFB84D; --blue:#4DA6FF; --text:#EAF0EE; --muted:#8492A0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:Inter,system-ui,sans-serif;
    min-height:100vh;padding:20px clamp(14px,3vw,34px) 60px}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1240px;margin:0 auto}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{height:24px}
  .brand h1{font-family:Archivo;font-size:15px;letter-spacing:.15em;font-weight:800;text-transform:uppercase}
  .brand span{color:var(--green)}
  .brand .tagctrl{font-size:10px;letter-spacing:.2em;color:var(--muted);border:1px solid var(--line);
    padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .who{font-size:13px;color:var(--muted)}
  .who b{color:var(--text)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:Archivo;font-weight:800;font-size:28px;margin-top:6px}
  .kpi.amber .v{color:var(--amber)} .kpi.green .v{color:var(--green)}
  .kpi.blue .v{color:var(--blue)} .kpi.red .v{color:var(--red)}

  .maintabs{display:flex;gap:8px;margin:26px 0 16px}
  .mt{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    font-family:Inter;font-weight:600;font-size:13px;padding:9px 18px;border-radius:10px;cursor:pointer}
  .mt.on{background:var(--surface2);color:var(--green);border-color:rgba(0,252,132,.3)}

  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .st{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .st.on{background:var(--surface);color:var(--text);border-color:var(--line)}
  .st .b{display:inline-block;min-width:18px;text-align:center;margin-left:6px;font-size:11px;
    background:var(--surface2);border-radius:20px;padding:1px 6px;color:var(--muted)}
  .st.on .b{background:var(--green);color:#05230f}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .rowlist{display:flex;flex-direction:column}
  .r{display:grid;grid-template-columns:1.4fr 1.3fr .7fr .8fr auto;gap:14px;align-items:center;
    padding:15px 18px;border-bottom:1px solid var(--line)}
  .r:last-child{border-bottom:0}
  @media(max-width:820px){.r{grid-template-columns:1fr;gap:8px}}
  .r .cli{font-weight:600}
  .r .cli small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
  .r .it{font-size:13px}
  .r .co{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold-hi);font-size:14px}
  .r .dt{font-size:12px;color:var(--muted)}
  .r .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .btn{font-family:Inter;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
  .btn:hover{filter:brightness(1.1)}
  .btn.ok{background:var(--green);color:#05230f;border:0}
  .btn.no{background:transparent;color:var(--red);border-color:rgba(255,96,96,.4)}
  .btn.ship{background:var(--blue);color:#04223f;border:0}
  .btn.sm{padding:6px 10px;font-size:12px}
  .addr{grid-column:1/-1;background:#0C1119;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-size:12.5px;color:var(--muted);line-height:1.6;display:none}
  .addr.show{display:block}
  .addr b{color:var(--text)}
  .lnk{font-size:12px;color:var(--green);cursor:pointer;border:0;background:0;padding:0;text-decoration:underline}
  .pill{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:700}
  .pill.pendente{background:rgba(255,184,77,.15);color:var(--amber)}
  .pill.aprovado{background:rgba(0,252,132,.14);color:var(--green)}
  .pill.enviado{background:rgba(77,166,255,.15);color:var(--blue)}
  .pill.entregue{background:rgba(132,146,160,.15);color:var(--muted)}
  .pill.recusado{background:rgba(255,96,96,.15);color:var(--red)}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}

  /* estoque */
  .stock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px}
  .stock-head h3{font-family:Archivo;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
  .strow{display:grid;grid-template-columns:2fr 1fr 1fr 1.1fr auto;gap:14px;align-items:center;
    padding:14px 18px;border-bottom:1px solid var(--line)}
  .strow:last-child{border-bottom:0}
  .strow.head{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  @media(max-width:820px){.strow{grid-template-columns:1fr 1fr;gap:8px}}
  .st-name{font-weight:600}
  .st-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stkinput{width:74px;background:#0C1119;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 9px;font-family:'JetBrains Mono',monospace;text-align:center}
  .st-off{opacity:.45}
  .coininline{width:15px;height:15px;vertical-align:middle;margin-right:5px}

  /* modais */
  .ov{position:fixed;inset:0;background:rgba(4,6,9,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
  .ov.show{display:flex}
  .modal{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
  .modal h3{font-family:Archivo;font-size:18px;margin-bottom:4px}
  .modal p{color:var(--muted);font-size:13px;margin-bottom:16px}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
  .modal input,.modal select,.modal textarea{width:100%;background:#0C1119;border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:10px 12px;font-family:Inter;font-size:14px}
  .modal .actions{display:flex;gap:10px;margin-top:20px}
  .modal .actions .btn{flex:1;text-align:center;justify-content:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface2);
    border:1px solid rgba(0,252,132,.4);padding:13px 20px;border-radius:12px;font-size:13.5px;
    z-index:80;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <img src="logo.png" alt="Insider"/>
      <h1>Insider <span>Rewards</span></h1>
      <span class="tagctrl">Controle</span>
    </div>
    <div class="who">Operador: <b>Equipe Insider</b></div>
  </div>

  <div class="kpis">
    <div class="kpi amber"><div class="l">Pendentes</div><div class="v" id="k-pend">0</div></div>
    <div class="kpi green"><div class="l">A enviar</div><div class="v" id="k-env">0</div></div>
    <div class="kpi blue"><div class="l">Enviados</div><div class="v" id="k-sent">0</div></div>
    <div class="kpi red"><div class="l">Itens em falta</div><div class="v" id="k-out">0</div></div>
  </div>

  <div class="maintabs">
    <button class="mt on" data-main="sol" onclick="setMain('sol')">Solicitações</button>
    <button class="mt" data-main="est" onclick="setMain('est')">Estoque</button>
  </div>

  <!-- SOLICITAÇÕES -->
  <div id="pane-sol">
    <div class="subtabs" id="subtabs"></div>
    <div class="card"><div class="rowlist" id="redlist"></div></div>
  </div>

  <!-- ESTOQUE -->
  <div id="pane-est" style="display:none">
    <div class="stock-head">
      <h3>Catálogo &amp; estoque</h3>
      <button class="btn ok" onclick="openAdd()">+ Cadastrar item</button>
    </div>
    <div class="card">
      <div class="strow head"><div>Item</div><div>Preço (IC)</div><div>Estoque</div><div>Status</div><div></div></div>
      <div id="stocklist"></div>
    </div>
  </div>
</div>

<!-- modal recusar -->
<div class="ov" id="ov-reject">
  <div class="modal">
    <h3>Recusar resgate</h3>
    <p id="reject-info"></p>
    <label>Motivo (o cliente recebe os coins de volta)</label>
    <textarea id="reject-reason" rows="3" placeholder="Ex.: item indisponível, dados incompletos..."></textarea>
    <div class="actions">
      <button class="btn" onclick="closeOv('ov-reject')">Cancelar</button>
      <button class="btn no" onclick="confirmReject()">Recusar e devolver coins</button>
    </div>
  </div>
</div>

<!-- modal enviar -->
<div class="ov" id="ov-ship">
  <div class="modal">
    <h3>Marcar como enviado</h3>
    <p id="ship-info"></p>
    <label>Código de rastreio (opcional)</label>
    <input id="ship-track" placeholder="Ex.: BR123456789BR" />
    <div class="actions">
      <button class="btn" onclick="closeOv('ov-ship')">Cancelar</button>
      <button class="btn ship" onclick="confirmShip()">Confirmar envio</button>
    </div>
  </div>
</div>

<!-- modal add item -->
<div class="ov" id="ov-add">
  <div class="modal">
    <h3 id="add-title">Cadastrar item</h3>
    <p>Preencha os dados do novo brinde da loja.</p>
    <label>Nome do item</label>
    <input id="add-name" placeholder="Ex.: Camiseta Insider Preta" />
    <div class="grid2">
      <div><label>Categoria</label>
        <select id="add-cat"><option value="físico">Físico</option><option value="digital">Digital</option><option value="cupom">Cupom</option></select>
      </div>
      <div><label>Preço em coins</label><input id="add-price" type="number" placeholder="7000" /></div>
    </div>
    <label>Estoque (deixe vazio p/ ilimitado — digital/cupom)</label>
    <input id="add-stock" type="number" placeholder="150" />
    <div class="actions">
      <button class="btn" onclick="closeOv('ov-add')">Cancelar</button>
      <button class="btn ok" onclick="saveItem()">Salvar item</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var COIN = "coin.png";
  var STAFF = "Equipe Insider";

  var CATALOG = [
    {id:"adesivos",name:"Pack de adesivos",cat:"físico",price:1000,stock:500,active:true},
    {id:"caneca",name:"Caneca Insider",cat:"físico",price:3600,stock:200,active:true},
    {id:"cupom50",name:"Cupom R$50 OFF",cat:"cupom",price:5000,stock:null,active:true},
    {id:"mousepad",name:"Mousepad gamer",cat:"físico",price:5000,stock:200,active:true},
    {id:"bone",name:"Boné Insider",cat:"físico",price:7000,stock:150,active:true},
    {id:"reset",name:"Reset grátis de challenge",cat:"digital",price:8000,stock:null,active:true},
    {id:"camiseta",name:"Camiseta Insider",cat:"físico",price:9000,stock:0,active:true},
    {id:"moletom",name:"Moletom Insider",cat:"físico",price:20000,stock:80,active:true},
    {id:"challenge",name:"Challenge grátis",cat:"digital",price:25000,stock:null,active:true},
    {id:"curso",name:"Curso De Zero a Trader",cat:"digital",price:50000,stock:null,active:true}
  ];

  var A1={nome:"João Pedro Alves",cpf:"111.222.333-44",tel:"(31) 99999-1234",cep:"30110-000",rua:"Av. Afonso Pena",num:"1500",comp:"Ap 302",bairro:"Centro",cidade:"Belo Horizonte",uf:"MG"};
  var A2={nome:"Marina Costa",cpf:"222.333.444-55",tel:"(11) 98888-4321",cep:"01310-100",rua:"Av. Paulista",num:"900",comp:"",bairro:"Bela Vista",cidade:"São Paulo",uf:"SP"};
  var A3={nome:"Rafael Souza",cpf:"333.444.555-66",tel:"(21) 97777-0000",cep:"22071-900",rua:"Av. Atlântica",num:"200",comp:"Bloco B",bairro:"Copacabana",cidade:"Rio de Janeiro",uf:"RJ"};
  var A4={nome:"Lucas Lima",cpf:"444.555.666-77",tel:"(41) 96666-1111",cep:"80010-010",rua:"Rua XV de Novembro",num:"55",comp:"",bairro:"Centro",cidade:"Curitiba",uf:"PR"};

  var REDS = [
    {id:"r1",cli:"João Pedro Alves",email:"joao@email.com",item:"Boné Insider",cat:"físico",coins:7000,date:"22/08 09:14",status:"pendente",addr:A1},
    {id:"r2",cli:"Marina Costa",email:"marina@email.com",item:"Moletom Insider",cat:"físico",coins:20000,date:"22/08 08:02",status:"pendente",addr:A2},
    {id:"r6",cli:"Bruno Dias",email:"bruno@email.com",item:"Cupom R$50 OFF",cat:"cupom",coins:5000,date:"22/08 07:30",status:"pendente",addr:null},
    {id:"r3",cli:"Rafael Souza",email:"rafael@email.com",item:"Caneca Insider",cat:"físico",coins:3600,date:"21/08 17:40",status:"aprovado",addr:A3},
    {id:"r4",cli:"Lucas Lima",email:"lucas@email.com",item:"Mousepad gamer",cat:"físico",coins:5000,date:"20/08 11:20",status:"enviado",tracking:"BR123456789BR",addr:A4},
    {id:"r5",cli:"Ana Beatriz",email:"ana@email.com",item:"Pack de adesivos",cat:"físico",coins:1000,date:"19/08 10:00",status:"entregue",addr:A1}
  ];

  var SUBS = [
    {k:"pendente",label:"Pendentes"},
    {k:"aprovado",label:"A enviar"},
    {k:"enviado",label:"Enviados"},
    {k:"entregue",label:"Entregues"},
    {k:"recusado",label:"Recusados"}
  ];
  var sub = "pendente";
  var main = "sol";
  var ctx = null; // resgate em ação nos modais

  function fmt(n){return n.toLocaleString("pt-BR");}
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2600);}
  function coinImg(sz){return '<img class="coininline" src="'+COIN+'" style="width:'+sz+'px;height:'+sz+'px"/>';}

  function setMain(m){
    main=m;
    document.querySelectorAll(".mt").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-main")===m);});
    document.getElementById("pane-sol").style.display = m==="sol"?"block":"none";
    document.getElementById("pane-est").style.display = m==="est"?"block":"none";
    render();
  }
  function setSub(k){ sub=k; render(); }

  function kpis(){
    document.getElementById("k-pend").textContent = REDS.filter(function(r){return r.status==="pendente";}).length;
    document.getElementById("k-env").textContent  = REDS.filter(function(r){return r.status==="aprovado";}).length;
    document.getElementById("k-sent").textContent = REDS.filter(function(r){return r.status==="enviado";}).length;
    document.getElementById("k-out").textContent  = CATALOG.filter(function(c){return c.stock===0;}).length;
  }

  function render(){
    kpis();
    // subtabs
    var stc=document.getElementById("subtabs"); stc.innerHTML="";
    SUBS.forEach(function(s){
      var n=REDS.filter(function(r){return r.status===s.k;}).length;
      var b=document.createElement("button");
      b.className="st"+(sub===s.k?" on":"");
      b.innerHTML=s.label+'<span class="b">'+n+'</span>';
      b.onclick=function(){setSub(s.k);};
      stc.appendChild(b);
    });
    // lista
    var list=document.getElementById("redlist"); list.innerHTML="";
    var rows=REDS.filter(function(r){return r.status===sub;});
    if(rows.length===0){ list.innerHTML='<div class="empty">Nenhum resgate nesta fila.</div>'; }
    rows.forEach(function(r){
      var acts="";
      if(r.status==="pendente") acts='<button class="btn ok sm" onclick="approve(\''+r.id+'\')">Aprovar</button><button class="btn no sm" onclick="openReject(\''+r.id+'\')">Recusar</button>';
      else if(r.status==="aprovado") acts='<button class="btn ship sm" onclick="openShip(\''+r.id+'\')">Marcar enviado</button>';
      else if(r.status==="enviado") acts='<button class="btn sm" onclick="deliver(\''+r.id+'\')">Marcar entregue</button>';
      var addrBtn = r.addr ? '<button class="lnk" onclick="toggleAddr(\''+r.id+'\')">ver endereço</button>' : '<span class="dt">entrega digital</span>';
      var el=document.createElement("div"); el.className="r";
      el.innerHTML =
        '<div class="cli">'+r.cli+'<small>'+r.email+'</small></div>'+
        '<div class="it">'+r.item+'<div class="dt">'+addrBtn+(r.tracking?' · '+r.tracking:'')+'</div></div>'+
        '<div class="co">'+coinImg(15)+fmt(r.coins)+'</div>'+
        '<div class="dt">'+r.date+' <span class="pill '+r.status+'">'+r.status+'</span></div>'+
        '<div class="acts">'+acts+'</div>'+
        (r.addr?('<div class="addr" id="ad-'+r.id+'"><b>'+r.addr.nome+'</b> · '+r.addr.cpf+' · '+r.addr.tel+'<br>'+
          r.addr.rua+', '+r.addr.num+(r.addr.comp?' - '+r.addr.comp:'')+'<br>'+
          r.addr.bairro+' · '+r.addr.cidade+'/'+r.addr.uf+' · CEP '+r.addr.cep+'</div>'):'');
      list.appendChild(el);
    });
    renderStock();
  }

  function toggleAddr(id){ var a=document.getElementById("ad-"+id); if(a) a.classList.toggle("show"); }

  function find(id){ for(var i=0;i<REDS.length;i++) if(REDS[i].id===id) return REDS[i]; return null; }

  function approve(id){ var r=find(id); if(!r)return; r.status="aprovado"; toast("Resgate de "+r.cli+" aprovado."); render(); }
  function deliver(id){ var r=find(id); if(!r)return; r.status="entregue"; toast("Marcado como entregue."); render(); }

  function openReject(id){ ctx=id; var r=find(id); document.getElementById("reject-info").textContent=r.item+" · "+r.cli+" · "+fmt(r.coins)+" IC"; document.getElementById("reject-reason").value=""; openOv("ov-reject"); }
  function confirmReject(){ var r=find(ctx); if(!r)return; r.status="recusado"; r.note=document.getElementById("reject-reason").value; closeOv("ov-reject"); toast(fmt(r.coins)+" IC devolvidos a "+r.cli+"."); render(); }

  function openShip(id){ ctx=id; var r=find(id); document.getElementById("ship-info").textContent=r.item+" · "+r.cli; document.getElementById("ship-track").value=""; openOv("ov-ship"); }
  function confirmShip(){ var r=find(ctx); if(!r)return; r.status="enviado"; r.tracking=document.getElementById("ship-track").value||null; closeOv("ov-ship"); toast("Envio confirmado."); render(); }

  // ESTOQUE
  function renderStock(){
    var sl=document.getElementById("stocklist"); if(!sl)return; sl.innerHTML="";
    CATALOG.forEach(function(c){
      var el=document.createElement("div"); el.className="strow"+(c.active?"":" st-off");
      var stockCell = c.stock===null
        ? '<span class="dt">ilimitado</span>'
        : '<input class="stkinput" type="number" value="'+c.stock+'" onchange="setStock(\''+c.id+'\',this.value)"/>';
      el.innerHTML =
        '<div><div class="st-name">'+c.name+'</div><div class="st-cat">'+c.cat+'</div></div>'+
        '<div class="co">'+coinImg(15)+fmt(c.price)+'</div>'+
        '<div>'+stockCell+'</div>'+
        '<div><button class="btn sm" onclick="toggleActive(\''+c.id+'\')">'+(c.active?"Ativo":"Inativo")+'</button></div>'+
        '<div class="acts"><button class="btn no sm" onclick="removeItem(\''+c.id+'\')">Remover</button></div>';
      sl.appendChild(el);
    });
  }
  function setStock(id,v){ for(var i=0;i<CATALOG.length;i++) if(CATALOG[i].id===id){CATALOG[i].stock=parseInt(v)||0;} kpis(); toast("Estoque atualizado."); }
  function toggleActive(id){ for(var i=0;i<CATALOG.length;i++) if(CATALOG[i].id===id){CATALOG[i].active=!CATALOG[i].active;} render(); }
  function removeItem(id){ if(!confirm("Remover este item da loja?"))return; CATALOG=CATALOG.filter(function(c){return c.id!==id;}); render(); toast("Item removido."); }
  function openAdd(){ document.getElementById("add-name").value=""; document.getElementById("add-price").value=""; document.getElementById("add-stock").value=""; openOv("ov-add"); }
  function saveItem(){
    var name=document.getElementById("add-name").value.trim();
    var price=parseInt(document.getElementById("add-price").value);
    var stk=document.getElementById("add-stock").value;
    var cat=document.getElementById("add-cat").value;
    if(!name||!price){ toast("Preencha nome e preço."); return; }
    CATALOG.push({id:"n"+Date.now(),name:name,cat:cat,price:price,stock:stk===""?null:parseInt(stk),active:true});
    closeOv("ov-add"); toast("Item cadastrado."); render();
  }

  function openOv(id){ document.getElementById(id).classList.add("show"); }
  function closeOv(id){ document.getElementById(id).classList.remove("show"); }

  render();
</script>
</body>
</html>
